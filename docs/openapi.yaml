openapi: 3.1.0
info:
  title: CampusCart Agent API
  version: 1.2.0
  description: >-
    Frontend-independent contract for the Hackathon sandbox. All bundled merchant,
    identity and payment adapters use synthetic data. No real funds move.
servers:
  - url: http://localhost:3000
paths:
  /api/v1/agent/capabilities:
    get:
      summary: Inspect framework, model mode and adapter capabilities
      responses:
        "200":
          description: Runtime capabilities and integration disclaimers
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/agent/runs:
    post:
      summary: Start an Agent run from natural-language purchase intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRun"
      responses:
        "201":
          description: Run paused for authorization, or failed if intent is unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/agent/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Read the current public Agent run
      responses:
        "200":
          description: Current run without private graph state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/agent/runs/{runId}/resume:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      summary: Resolve the current one-time human action
      description: >-
        The actionId must equal the run's current pendingAction.actionId. Replayed or
        stale actions return 409. Expired actions return 410 ACTION_EXPIRED. Payment
        purchase approval may include one of pendingAction.eligiblePlanIds as planId;
        omitting it keeps the recommendation for backwards compatibility. Payment
        decisions must also include the exact paymentSessionId, binding run + action +
        provider session. A payment method cannot be changed after the selected plan is
        locked; changing it requires a new evaluation and lock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRun"
      responses:
        "200":
          description: Updated run, possibly paused for the next human action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "409":
          description: Stale, already-used, or mismatched action
        "410":
          description: The current action expired and the transaction was closed
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/agent/runs/{runId}/messages:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      summary: Ask a grounded question about this run
      description: >-
        With an LLM configured, the model can inspect authoritative run facts and
        retrieve cited CampusCart knowledge through read-only tools. Retrieved text
        cannot override deterministic checkout rules. Without a key, deterministic
        answers cover the chosen plan, recorded block reason and matching knowledge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        "200":
          description: Grounded answer and active Agent mode
  /api/v1/agent/runs/{runId}/feedback:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      summary: Mark the terminal run's reflection memory as helpful or unhelpful
      description: >-
        Helpful feedback keeps the episode verified. Unhelpful feedback rejects the
        episode so it is no longer recalled by later Agent runs. Feedback never changes
        deterministic checkout or payment policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rating]
              properties:
                rating:
                  type: string
                  enum: [helpful, unhelpful]
                note:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "200":
          description: Updated quality-gated reflection memory and feedback history
        "404":
          description: Run or reflection memory not found
        "409":
          description: Run has not reached a terminal state
  /api/v1/agent/runs/{runId}/trace:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Read the hash-chained tool and state transition trace
      responses:
        "200":
          description: Ordered trace events
  /api/v1/agent/runs/{runId}/transaction:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Read the Agent-owned deterministic transaction and audit chain
      description: This transaction cannot be executed through the retired legacy session API.
      responses:
        "200":
          description: Current transaction state, Benefit Lock, outcome and audit events
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/agent/runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      summary: Stream existing and new trace events over SSE
      responses:
        "200":
          description: text/event-stream with event type trace
          content:
            text/event-stream:
              schema:
                type: string
  /api/v1/after-sales/capabilities:
    get:
      summary: Inspect available sandbox after-sales actions and safety boundaries
      responses:
        "200":
          description: After-sales capabilities
  /api/v1/after-sales/cases:
    get:
      summary: List after-sales cases, optionally filtered by runId or orderId
      parameters:
        - name: runId
          in: query
          schema:
            type: string
            format: uuid
        - name: orderId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Matching service cases
    post:
      summary: Create an after-sales case for a completed Agent order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAfterSalesCase"
      responses:
        "201":
          description: Case awaiting confirmation, rejected by policy, or routed to manual review
        "409":
          description: The order is not serviceable or was already refunded
        "422":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/after-sales/requests:
    post:
      summary: Start an after-sales case from natural-language intent
      description: >-
        Parses cancel-order, refund, return or exchange intent, then creates the
        same policy-checked service case. Refund-capable actions still require the
        separate one-time confirmation returned as pendingAction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runId, message]
              properties:
                runId:
                  type: string
                  format: uuid
                message:
                  type: string
                  minLength: 3
                  maxLength: 1000
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        "201":
          description: Parsed and policy-checked after-sales case
        "422":
          description: Validation failure or unclear after-sales intent
  /api/v1/after-sales/cases/{caseId}:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    get:
      summary: Read an after-sales case and its hash-chained audit record
      responses:
        "200":
          description: Current service case
        "404":
          description: Service case not found
  /api/v1/after-sales/cases/{caseId}/resume:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      summary: Approve or reject the current one-time after-sales confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeAfterSalesCase"
      responses:
        "200":
          description: Updated case and simulated refund result
        "409":
          description: Stale or already-used action
        "410":
          description: Confirmation expired
components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
  responses:
    InvalidRequest:
      description: Zod validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Agent run not found
  schemas:
    CreateRun:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          examples:
            - 帮我买这台 iPad，预算 HK$3,600，最多用 100 积分
        context:
          type: object
          properties:
            locale:
              type: string
              default: zh-HK
            currency:
              type: string
              const: HKD
            demoScenario:
              type: string
              enum: [success, blocked]
              default: success
            selectedProduct:
              type: object
              description: >-
                Optional explicit product-page context. It is used only for deictic
                requests such as “buy this item”; it never replaces an explicit
                unsupported product request.
              required: [sku, source, userConfirmed]
              additionalProperties: false
              properties:
                sku:
                  type: string
                  examples: [EDU-IPAD-A16-128-SLV]
                source:
                  type: string
                  enum: [product_page, catalog_selection]
                userConfirmed:
                  type: boolean
                  const: true
    ResumeRun:
      oneOf:
        - type: object
          additionalProperties: false
          required: [actionId, decision]
          properties:
            actionId:
              type: string
            decision:
              type: string
              const: approve
            planId:
              type: string
              description: An ID from the current purchase action's eligiblePlanIds; defaults to the recommendation when omitted.
        - type: object
          additionalProperties: false
          required: [actionId, decision]
          properties:
            actionId:
              type: string
            decision:
              type: string
              const: reject
        - type: object
          additionalProperties: false
          required: [actionId, decision, paymentSessionId]
          properties:
            actionId:
              type: string
            decision:
              type: string
              enum: [authenticated, failed]
            paymentSessionId:
              type: string
    AgentRun:
      type: object
      required: [id, status, agentMode, framework, trace]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [running, needs_user_action, needs_clarification, completed, blocked, cancelled, expired, failed]
        agentMode:
          type: string
          enum:
            - langchain_llm_tools
            - langgraph_deterministic_fallback
            - langgraph_fallback_after_model_error
        framework:
          type: object
          properties:
            agent:
              const: LangChain
            orchestration:
              const: LangGraph
        pendingAction:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        proposal:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        outcome:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        trace:
          type: array
          items:
            type: object
            required: [sequence, type, at, previousHash, hash]
            additionalProperties: true
    CreateAfterSalesCase:
      type: object
      additionalProperties: false
      required: [runId, requestedAction, reason]
      properties:
        runId:
          type: string
          format: uuid
        requestedAction:
          type: string
          enum: [cancel_order, refund, return, exchange]
        reason:
          type: string
          minLength: 3
          maxLength: 1000
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 200
    ResumeAfterSalesCase:
      type: object
      additionalProperties: false
      required: [actionId, decision]
      properties:
        actionId:
          type: string
        decision:
          type: string
          enum: [approve, reject]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        issues:
          type: array
          items:
            type: object
            additionalProperties: true
